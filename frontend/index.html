<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Apparel & Textiles</title>
  <meta name="description" content="Admin dashboard for managing products, orders, customers, and inventory for Apparel & Textiles store.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0d17;
      color: #e0e0f0;
      overflow-x: hidden;
    }
    #app-loader {
      position: fixed; inset: 0; z-index: 9999;
      background: #0b0d17;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1.5rem;
    }
    .loader-brand { font-size: 1.5rem; font-weight: 700; color: #a78bfa; letter-spacing: 0.05em; }
    .loader-spinner { width: 36px; height: 36px; border: 3px solid rgba(167,139,250,0.2); border-top-color: #a78bfa; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loader">
    <div class="loader-brand"><i class="fas fa-chart-line"></i> Admin Panel</div>
    <div class="loader-spinner"></div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/admin/admin-app.js"></script>
</body>
</html>
